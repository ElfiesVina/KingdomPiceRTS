<html lang="id">
<head>

  <meta name="theme-color" content="#142c43">
  <meta name="description" content="Kingdom Pixel RTS — strategi real-time pixel art.">
  <title>Kingdom Pixel RTS</title>
  <link rel="stylesheet" href="style.css">
